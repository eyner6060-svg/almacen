services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: almacen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-almacen_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-almacen_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - almacen-network

  # Redis para caché
  redis:
    image: redis:7-alpine
    container_name: almacen-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - almacen-network

  # Aplicación Principal
  almacen-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-almacen
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-almacen_db}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-cambiar-esta-clave-secreta-en-produccion}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - HASH_PEPPER=${HASH_PEPPER:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Persistir uploads
      - almacen-uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - almacen-network

  # Nginx Proxy (Opcional - para SSL y dominio)
  nginx:
    image: nginx:alpine
    container_name: almacen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - almacen-app
    networks:
      - almacen-network

  # PgAdmin (Opcional - Administración de base de datos)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: almacen-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
      PGADMIN_LISTEN_PORT: 5050
    profiles:
      - admin
    ports:
      - "${PGADMIN_PORT:-5050}:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - almacen-network

  # Redis Commander (Opcional - Administración de Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: almacen-redis-commander
    restart: unless-stopped
    profiles:
      - admin
    environment:
      - REDIS_HOSTS=local:redis:6379:${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - almacen-network

# Volúmenes para persistencia de datos
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local
  almacen-uploads:
    driver: local

# Red para comunicación entre servicios
networks:
  almacen-network:
    driver: bridge
