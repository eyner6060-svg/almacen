# ============================================================
# Portainer Stack - Sistema de Gestión de Almacén
# ============================================================
# Uso:
#   1. Portainer → Stacks → Add Stack → Git
#   2. Repository URL: https://github.com/eyner6060-svg/almacen
#   3. Reference: master
#   4. Compose path: deploy/portainer-stack.yml
#   5. En "Environment variables" llenar los valores requeridos
#   6. Deploy the stack
# ============================================================
# NOTA: Usa deploy/nginx.deploy.conf (solo HTTP) para la primera
#       instalación. Cuando tenga SSL, cambie a nginx.conf.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: almacen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: almacen_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d almacen_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - almacen-network

  redis:
    image: redis:7-alpine
    container_name: almacen-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - almacen-network

  almacen-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-almacen
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/almacen_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - almacen-uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - almacen-network

  nginx:
    image: nginx:alpine
    container_name: almacen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.deploy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - almacen-app
    networks:
      - almacen-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  almacen-uploads:
    driver: local

networks:
  almacen-network:
    driver: bridge
